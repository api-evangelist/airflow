        description: Airflow Get Extra Links
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        - name: dag_run_id
          in: path
          type: string
          required: true
        - name: task_id
