naftiko: 1.0.0-alpha2
info:
  label: Airflow API — DagVersion
  description: 'Airflow API — DagVersion. 2 operations. Lead operation: Airflow Get Dag Versions. Self-contained Naftiko capability
    covering one Airflow business surface.'
  tags:
  - Airflow
  - DagVersion
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AIRFLOW_API_KEY: AIRFLOW_API_KEY
capability:
  consumes:
  - type: http
    namespace: airflow-dagversion
    baseUri: ''
    description: Airflow API — DagVersion business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-dags-dag_id-dagVersions
      path: /api/v2/dags/{dag_id}/dagVersions
      operations:
      - name: getdagversions
        method: GET
        description: Airflow Get Dag Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
        - name: version_number
          in: query
          type: integer
        - name: bundle_name
          in: query
          type: string
        - name: bundle_version
          in: query
          type: string
        - name: order_by
          in: query
          type: array
          description: 'Attributes to order by, multi criteria sort is supported. Prefix with `-` for descending order. Supported
            attributes: `id, version_number, bundle_name, bundle_v'
    - name: api-v2-dags-dag_id-dagVersions-version_number
      path: /api/v2/dags/{dag_id}/dagVersions/{version_number}
      operations:
      - name: getdagversion
        method: GET
        description: Airflow Get Dag Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        - name: version_number
          in: path
          type: integer
          required: true
    authentication:
      type: bearer
      token: '{{env.AIRFLOW_API_KEY}}'
  exposes:
  - type: rest
    namespace: airflow-dagversion-rest
    port: 8080
    description: REST adapter for Airflow API — DagVersion. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/dags/{dag-id}/dagversions
      name: api-v2-dags-dag-id-dagversions
      description: REST surface for api-v2-dags-dag_id-dagVersions.
      operations:
      - method: GET
        name: getdagversions
        description: Airflow Get Dag Versions
        call: airflow-dagversion.getdagversions
        with:
          dag_id: rest.dag_id
          limit: rest.limit
          offset: rest.offset
          version_number: rest.version_number
          bundle_name: rest.bundle_name
          bundle_version: rest.bundle_version
          order_by: rest.order_by
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/dags/{dag-id}/dagversions/{version-number}
      name: api-v2-dags-dag-id-dagversions-version-number
      description: REST surface for api-v2-dags-dag_id-dagVersions-version_number.
      operations:
      - method: GET
        name: getdagversion
        description: Airflow Get Dag Version
        call: airflow-dagversion.getdagversion
        with:
          dag_id: rest.dag_id
          version_number: rest.version_number
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: airflow-dagversion-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airflow API — DagVersion. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: airflow-get-dag-versions
      description: Airflow Get Dag Versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: airflow-dagversion.getdagversions
      with:
        dag_id: tools.dag_id
        limit: tools.limit
        offset: tools.offset
        version_number: tools.version_number
        bundle_name: tools.bundle_name
        bundle_version: tools.bundle_version
        order_by: tools.order_by
      outputParameters:
      - type: object
        mapping: $.
    - name: airflow-get-dag-version
      description: Airflow Get Dag Version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: airflow-dagversion.getdagversion
      with:
        dag_id: tools.dag_id
        version_number: tools.version_number
      outputParameters:
      - type: object
        mapping: $.
