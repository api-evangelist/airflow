      path: /api/v2/connections/defaults
      operations:
      - name: createdefaultconnections
        method: POST
        description: Airflow Create Default Connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v2-connections-test
      path: /api/v2/connections/test
      operations:
      - name: testconnection
        method: POST
        description: Airflow Test Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-connections-connection_id
      path: /api/v2/connections/{connection_id}
      operations:
      - name: deleteconnection
        method: DELETE
        description: Airflow Delete Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: connection_id
          in: path
          type: string
          required: true
      - name: getconnection
        method: GET
        description: Airflow Get Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: connection_id
          in: path
          type: string
          required: true
      - name: patchconnection
        method: PATCH
        description: Airflow Patch Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: connection_id
          in: path
          type: string
          required: true
        - name: update_mask
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.AIRFLOW_API_KEY}}'
  exposes:
  - type: rest
    namespace: airflow-connection-rest
    port: 8080
    description: REST adapter for Airflow API — Connection. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/connections
      name: api-v2-connections
      description: REST surface for api-v2-connections.
      operations:
      - method: GET
        name: getconnections
        description: Airflow Get Connections
        call: airflow-connection.getconnections
        with:
          limit: rest.limit
          offset: rest.offset
          order_by: rest.order_by
          connection_id_pattern: rest.connection_id_pattern
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postconnection
        description: Airflow Post Connection
        call: airflow-connection.postconnection
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
