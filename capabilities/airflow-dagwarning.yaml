naftiko: 1.0.0-alpha2
info:
  label: Airflow API — DagWarning
  description: 'Airflow API — DagWarning. 1 operations. Lead operation: Airflow List Dag Warnings. Self-contained Naftiko
    capability covering one Airflow business surface.'
  tags:
  - Airflow
  - DagWarning
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AIRFLOW_API_KEY: AIRFLOW_API_KEY
capability:
  consumes:
  - type: http
    namespace: airflow-dagwarning
    baseUri: ''
    description: Airflow API — DagWarning business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-dagWarnings
      path: /api/v2/dagWarnings
      operations:
      - name: listdagwarnings
        method: GET
        description: Airflow List Dag Warnings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dag_id
          in: query
          type: string
        - name: warning_type
          in: query
          type: string
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
        - name: order_by
          in: query
          type: array
          description: 'Attributes to order by, multi criteria sort is supported. Prefix with `-` for descending order. Supported
            attributes: `dag_id, warning_type, message, timestamp`'
    authentication:
      type: bearer
      token: '{{env.AIRFLOW_API_KEY}}'
  exposes:
  - type: rest
    namespace: airflow-dagwarning-rest
    port: 8080
    description: REST adapter for Airflow API — DagWarning. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/dagwarnings
      name: api-v2-dagwarnings
      description: REST surface for api-v2-dagWarnings.
      operations:
      - method: GET
        name: listdagwarnings
        description: Airflow List Dag Warnings
        call: airflow-dagwarning.listdagwarnings
        with:
          dag_id: rest.dag_id
          warning_type: rest.warning_type
          limit: rest.limit
          offset: rest.offset
          order_by: rest.order_by
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: airflow-dagwarning-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airflow API — DagWarning. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: airflow-list-dag-warnings
      description: Airflow List Dag Warnings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: airflow-dagwarning.listdagwarnings
      with:
        dag_id: tools.dag_id
        warning_type: tools.warning_type
        limit: tools.limit
        offset: tools.offset
        order_by: tools.order_by
      outputParameters:
      - type: object
        mapping: $.
